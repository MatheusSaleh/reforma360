services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - calculadoras
        depends_on:
            - mysql
            - redis
            - calculadora-regular
            - calculadora-simples
            - danfse
    # Filas (importações e simulações em lote) com Horizon. Painel em /horizon.
    horizon:
        image: 'sail-8.5/app'
        command:
            - php
            - artisan
            - horizon
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - calculadoras
        depends_on:
            - laravel.test
            - mysql
            - redis
        restart: unless-stopped
    # Tarefas agendadas (routes/console.php), ex.: apagar XMLs de NFS-e vencidos.
    scheduler:
        image: 'sail-8.5/app'
        command:
            - php
            - artisan
            - schedule:work
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - mysql
            - redis
        restart: unless-stopped
    # WebSocket do progresso em tempo real (Laravel Reverb).
    reverb:
        image: 'sail-8.5/app'
        command:
            - php
            - artisan
            - reverb:start
            - '--host=0.0.0.0'
            - '--port=8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        ports:
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - laravel.test
            - redis
        restart: unless-stopped
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    # Calculadoras da Receita Federal (código upstream em services/, sem modificações).
    # Ficam só na rede interna "calculadoras", sem portas publicadas no host.
    calculadora-db:
        image: 'maven:3.9-eclipse-temurin-25'
        working_dir: /src
        command:
            - sh
            - '-c'
            - >-
                mvn -B -q flyway:migrate
                -Dflyway.configFiles=./flyway/flyway-pro.conf
                "-Dflyway.url=jdbc:sqlite:file:/db/calculadora-pro.db?date_class=TEXT&foreign_keys=ON"
        volumes:
            - './services/calculadora-rtc-regime-regular:/src'
            - 'calculadora-db:/db'
            - 'calculadora-m2:/root/.m2'
        networks:
            - sail
    calculadora-regular:
        build:
            context: './services/calculadora-rtc-regime-regular'
            dockerfile: '../../docker/calculadora-java/Dockerfile'
        image: 'reforma360/calculadora-regime-regular'
        environment:
            SERVER_PORT: 8080
        volumes:
            - 'calculadora-db:/app/calculadora/db:ro'
        networks:
            - calculadoras
        depends_on:
            calculadora-db:
                condition: service_completed_successfully
        healthcheck:
            test:
                - CMD
                - wget
                - '-q'
                - '-O'
                - /dev/null
                - 'http://localhost:8080/api/calculadora/dados-abertos/versao'
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s
    calculadora-simples:
        build:
            context: './services/calculadora-rtc-simples-nacional'
            dockerfile: '../../docker/calculadora-java/Dockerfile'
        image: 'reforma360/calculadora-simples-nacional'
        environment:
            SERVER_PORT: 8080
        volumes:
            - 'calculadora-db:/app/calculadora/db:ro'
        networks:
            - calculadoras
        depends_on:
            calculadora-db:
                condition: service_completed_successfully
        healthcheck:
            test:
                - CMD
                - wget
                - '-q'
                - '-O'
                - /dev/null
                - 'http://localhost:8080/api/versao'
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 60s
    danfse:
        build:
            context: './services/calculadora-rtc-gerador-danfse'
        image: 'reforma360/danfse'
        networks:
            - calculadoras
        healthcheck:
            test:
                - CMD
                - wget
                - '-q'
                - '-O'
                - /dev/null
                - 'http://localhost:8080/health/ready'
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s
networks:
    sail:
        driver: bridge
    calculadoras:
        driver: bridge
        internal: true
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    calculadora-db:
        driver: local
    calculadora-m2:
        driver: local
