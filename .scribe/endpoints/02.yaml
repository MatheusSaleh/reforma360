  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/simulacoes
    metadata:
      custom: []
      groupName: 'Simulação do catálogo'
      groupDescription: 'Simula todos os produtos da empresa (ou os itens de uma nota importada) em segundo plano. Permissão: `simulacoes`.'
      subgroup: ''
      subgroupDescription: ''
      title: 'Iniciar simulação do catálogo'
      description: |-
        Enfileira a simulação de todos os produtos da empresa — ou só dos itens de uma nota importada, com `importacao_id` — e responde `202` na hora.

        Acompanhe o andamento em `GET /api/v1/simulacoes/{id}` (campo `status`) e leia o resultado de cada item em `GET /api/v1/simulacoes/{id}/itens`.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {SEU_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      uf:
        custom: []
        name: uf
        description: 'UF da operação (sigla).'
        required: true
        example: RS
        type: string
        enumValues:
          - RO
          - AC
          - AM
          - RR
          - PA
          - AP
          - TO
          - MA
          - PI
          - CE
          - RN
          - PB
          - PE
          - AL
          - SE
          - BA
          - MG
          - ES
          - RJ
          - SP
          - PR
          - SC
          - RS
          - MS
          - MT
          - GO
          - DF
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      municipio:
        custom: []
        name: municipio
        description: 'Código IBGE do município (7 dígitos), da UF informada. :Attribute deve ter 7 dígitos.'
        required: true
        example: '4314902'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      data:
        custom: []
        name: data
        description: 'Data do fato gerador (AAAA-MM-DD), entre 2026 e 2033. Must be a valid date in the format <code>Y-m-d</code>. :Attribute deve ser uma data igual ou posterior a <code>2026-01-01</code>. :Attribute deve ser uma data igual ou anterior a <code>2033-12-31</code>.'
        required: true
        example: '2027-03-10'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      aliquota_cbs:
        custom: []
        name: aliquota_cbs
        description: 'Alíquota nominal da CBS em %, texto decimal. Obrigatória de 2027 em diante e proibida em 2026. :Attribute deve ser no mínimo 0. :Attribute deve ser no máximo 100.'
        required: false
        example: 8.8
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      aliquota_ibs_estadual:
        custom: []
        name: aliquota_ibs_estadual
        description: 'Alíquota nominal do IBS estadual em %. Obrigatória de 2027 em diante. :Attribute deve ser no mínimo 0. :Attribute deve ser no máximo 100.'
        required: false
        example: 0.05
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      aliquota_ibs_municipal:
        custom: []
        name: aliquota_ibs_municipal
        description: 'Alíquota nominal do IBS municipal em %. Obrigatória de 2027 em diante. :Attribute deve ser no mínimo 0. :Attribute deve ser no máximo 100.'
        required: false
        example: 0.05
        type: number
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
